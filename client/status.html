<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서비스 상태</title>
<style>
  :root { --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6b6b70; --ok: #1a7f37; --bad: #c62828; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111; --fg: #eee; --muted: #999; --card: #1c1c1e; } }
  :root[data-theme="dark"] { --bg: #111; --fg: #eee; --muted: #999; --card: #1c1c1e; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .state { font-size: 20px; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .muted { color: var(--muted); font-size: 14px; }
  .inc { border-top: 1px solid rgba(127,127,127,.25); padding: 10px 0; }
  .inc:first-child { border-top: none; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 48px; }
  .bar { flex: 1; height: 100%; border-radius: 2px; background: rgba(127,127,127,.25); }
  .bar.ok { background: var(--ok); } .bar.warn { background: #d4a017; } .bar.bad { background: var(--bad); }
  .legend { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>메신저 서비스 상태</h1>
  <div class="card">
    <div id="state" class="state">확인 중...</div>
    <p class="muted" id="detail"></p>
  </div>
  <div class="card">
    <h2 style="font-size:17px;margin:0 0 8px">최근 30일 가용성 <span id="uptime30" class="muted"></span></h2>
    <div id="bars" class="bars"></div>
    <div class="legend muted"><span>30일 전</span><span>오늘</span></div>
    <p class="muted" style="font-size:12px">5분마다 측정한 결과입니다. 회색은 측정 기록이 없는 날입니다.</p>
  </div>
  <div class="card">
    <h2 style="font-size:17px;margin:0 0 8px">장애 이력</h2>
    <div id="incidents"><p class="muted">불러오는 중...</p></div>
  </div>
  <p class="muted">60초마다 자동으로 갱신됩니다.</p>
</main>
<script>
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  async function load() {
    const box = document.getElementById('incidents');
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const s = await r.json();
      const st = document.getElementById('state');
      st.textContent = s.ok ? '정상 운영 중' : '점검이 필요합니다';
      st.className = 'state ' + (s.ok ? 'ok' : 'bad');
      renderHistory(s.history);
      document.getElementById('detail').textContent =
        '데이터베이스 ' + (s.db === 'ok' ? '정상' : '오류') + ' · 응답 ' + s.latency_ms + 'ms · 확인 ' +
        new Date(s.checked_at).toLocaleString('ko-KR');
      if (!s.incidents.length) {
        box.innerHTML = '<p class="muted">기록된 장애가 없습니다.</p>';
      } else {
        box.innerHTML = s.incidents.map((i) =>
          '<div class="inc"><div><b>' + esc(i.date) + '</b> · ' + esc(i.title) + ' <span class="muted">' +
          (i.resolved ? '(해결됨)' : '(조치 중)') + '</span></div>' +
          (i.detail ? '<div class="muted">' + esc(i.detail) + '</div>' : '') + '</div>').join('');
      }
    } catch (e) {
      document.getElementById('state').textContent = '상태를 확인할 수 없습니다';
      document.getElementById('state').className = 'state bad';
    }
  }
  function renderHistory(h) {
    const bars = document.getElementById('bars');
    const label = document.getElementById('uptime30');
    if (!h) { bars.innerHTML = ''; label.textContent = '· 기록을 불러오지 못했습니다'; return; }
    label.textContent = h.uptime30 == null ? '' : '· 30일 가용률 ' + h.uptime30 + '%';
    bars.innerHTML = h.days.map((d) => {
      const cls = d.uptime == null ? '' : d.uptime >= 99.9 ? 'ok' : d.uptime >= 99 ? 'warn' : 'bad';
      const title = d.date + ' · ' + (d.uptime == null ? '측정 기록 없음' : d.uptime + '% (측정 ' + d.samples + '회)');
      return '<div class="bar ' + cls + '" title="' + esc(title) + '"></div>';
    }).join('');
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
