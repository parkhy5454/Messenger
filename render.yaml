# Render Blueprint: 메신저 앱 서버 (웹 화면 포함). DB는 Neon(PostgreSQL)을 사용합니다.
services:
  - type: web
    name: messenger-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false              # Neon 연결 문자열 (sslmode=require 포함)
      - key: PGSSL
        value: "true"            # Neon은 SSL 연결 필요
      - key: KAKAO_REST_KEY
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false              # https://<서비스주소>.onrender.com/api/auth/kakao/callback
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false              # Gmail 앱 비밀번호
      - key: SMTP_FROM
        sync: false
